name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'

# Sets permissions for GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ToneForge is a required `file:../ToneForge` dependency, so the pinned
      # sibling checkout must exist before `npm ci` resolves it. Its CLI runs
      # from source via tsx (a devDependency), so install the sibling's own
      # dependencies as well; otherwise the build-time render step cannot run.
      - name: Clone pinned ToneForge
        run: |
          revision="$(node -p "require('./audio/toneforge/pin.json').revision")"
          git clone --quiet https://github.com/TheWizardsCode/ToneForge.git ../ToneForge
          git -C ../ToneForge checkout --quiet "$revision"
          npm ci --prefix ../ToneForge

      - name: Install dependencies
        run: npm ci

      - name: Verify audio assets
        run: npm run build-audio:verify

      - name: Build
        run: npm run build

      - name: Bundle hygiene check
        run: npm run check-bundle

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
