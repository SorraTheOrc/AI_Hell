      decay: 0.09
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.14
  # v1 — brittle tink overtone.
  v1:
    kind: oscillator
    params:
      type: sine
      frequency: 4200
  e1:
