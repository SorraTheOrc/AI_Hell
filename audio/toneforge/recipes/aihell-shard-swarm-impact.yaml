# AI Hell cue: aihell-shard-swarm-impact — Player Shard Swarm connect — a bright
# glassy lime tink, ≤ 0.12 s.
#
# (AH-0MVV0WMTE0007NGS) A five-shard volley can connect in a single frame, so
# the impact cue must be bright, short and glassy so overlapping hits read as
# one shimmering lime tink rather than a low thud or a machine-gun stutter. A
# fast triangle 2800 → 1900 Hz carries the glass body, a short 4200 Hz sine
# adds the brittle "tink" overtone and a high-passed noise tick supplies the
# contact transient. Total 0.10 s — comfortably under the 0.12 s ceiling — so
# the shipped per-cue voice limiter (4 voices / 150 ms) is enough with no added
# throttling. Deliberately higher, glassier and shorter than the Cannon's
# 520 → 90 Hz impact thump.
#
# Seed 32280 is drawn from the game-specific reservation block (the Shard Swarm
# pair 32279/32280; docs/AUDIO_TONEFORGE_CUE_MAPPING.md) and baked via
# scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-shard-swarm-impact
  description: Player Shard Swarm connect — a bright glassy lime tink of a fast triangle 2800 to 1900 Hz with a 4200 Hz sine overtone and a high-passed noise contact tick, 0.10 s. High, glassy and short so a five-shard volley reads as one shimmering lime hit, clearly distinct from the Cannon's 520 to 90 Hz thump.
