# AI Hell cue: aihell-railgun-impact — Player Railgun connect — a short metallic
# crack with a brief ring (AH-0MVMIGVCE004VSNA). Kept to ~0.14 s so a five-target
# pierce chain reads as one crisp salvo rather than a machine-gun stutter.
version: "0.1"
meta:
  name: aihell-railgun-impact
  description: Player Railgun tracer connect — a short metallic crack (sawtooth 1400 to 240 Hz) with a brief 1760 Hz sine ring and a high-pass noise tick. ~0.14 s so the five-target pierce chain reads as a single crisp salvo, and clearly distinct from the Wave Laser's neon snap (800 to 200 Hz) and the Cannon's 520 to 90 Hz impact thump.
  category: AIHell
  tags:
    - weapon
    - hit
  duration: 0.14
nodes:
  v0:
    kind: oscillator
    params:
      type: sawtooth
      frequency: 1400
    automation:
      frequency:
        - kind: set
          time: 0
          value: 1400
        - kind: exponentialRamp
          time: 0.03
          value: 500
        - kind: exponentialRamp
          time: 0.12
          value: 240
  e0:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.12
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.15
  v1:
    kind: oscillator
    params:
      type: sine
      frequency: 1760
  e1:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.09
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0.06
  v2:
    kind: noise
    params:
      color: white
      level: 1
  f2:
    kind: biquadFilter
    params:
      type: highpass
      frequency: 3500
      Q: 1
  e2:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.04
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0.08
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - chain: [v1, e1, g1, mix]
  - chain: [v2, f2, e2, g2, mix]
  - from: mix
    to: out
