# AI Hell cue: aihell-mystery-ufo-warble — Mystery UFO warble — loopable "woo-woo-woo" square siren sweeping a four-note A-minor phrase, ~2.4 s.
# The classic Space Invaders mystery-ship homage: a square wave glides down
# A5 → F5 → D5 → B4 and back up over 2.4 s, so the whole loop is one
# continuous "woo-woo" siren. Played as a looping continuous cue (start at
# spawn, stop on return/payout/destruction) by the shared playback layer.
