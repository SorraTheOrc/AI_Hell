# AI Hell cue: aihell-mortar-impact — Mortar shell impact — sharp dry crack before the heavy detonation boom.
version: "0.1"
meta:
  name: aihell-mortar-impact
  description: Mortar shell impact — a bright triangle drop 900 to 150 Hz with a dry noise smack, the shell-landing crack that precedes the heavy aihell-mortar-detonation boom, distinct from every other weapon impact cue.
  category: AIHell
  tags:
    - weapon
    - hit
  duration: 0.12
nodes:
