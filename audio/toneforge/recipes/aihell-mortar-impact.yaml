    kind: oscillator
    params:
      type: triangle
      frequency: 900
    automation:
      frequency:
        - kind: set
          time: 0
          value: 900
        - kind: exponentialRamp
          time: 0.1
          value: 150
  e0:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.108
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.14
  v1:
    kind: noise
    params:
      color: white
      level: 1
  f1:
    kind: biquadFilter
    params:
      type: highpass
      frequency: 1200
      Q: 1
  e1:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.05
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0.05
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - chain: [v1, f1, e1, g1, mix]
  - from: mix
    to: out
