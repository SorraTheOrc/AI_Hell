# AI Hell cue: aihell-mining-laser-fire — Mining Laser fire — a short amber
# "cutting" tick: a saw chirp from 1320 → 660 Hz with a high-passed noise bite,
# ~0.07 s. Deliberately short and mid-bright so a rapid cadence (up to one shot
# per sixteenth note) never smears into the enemy-fire telegraphs, and
# deliberately distinct from the player cannon's square 800 → 400 Hz tick so the
# two weapons are told apart by ear (AH-0MW9QMQ7B005WFH9, parent Mining laser
# AH-0MW81181P007BDRU).
version: "0.1"
meta:
  name: aihell-mining-laser-fire
  description: Mining Laser fire — short amber cutting tick, saw chirp 1320 to 660 Hz plus a high-pass noise bite, ~0.07 s.
  category: AIHell
