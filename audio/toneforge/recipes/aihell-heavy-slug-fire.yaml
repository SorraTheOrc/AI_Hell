# AI Hell cue: aihell-heavy-slug-fire — Player Heavy Slug fire — the heaviest
# single shot in the game: a low 60–130 Hz boom with a metallic clank
# transient and the longest decay of the packaged weapons (≈ 0.26 s).
#
# (AH-0MVV0WO4M001KEDG) One huge, slow, deep-red `heavy-shell` per shot — the
# launch must feel heavier than every other single-shot weapon. A short square
# 1800 → 900 Hz clank supplies the metallic transient, a low saw body
# 110 → 55 Hz carries the boom (the deepest fundamental in the catalogue), a
# sine an octave below reinforces the weight, and a low-passed noise puff adds
# the air of a huge shell leaving the hull. Total ≈ 0.26 s — the longest decay
# of the packaged weapon set (Cannon 0.08 / Shard Swarm 0.15 / Rear Guard 0.14
# / Broadside 0.16 / Railgun 0.20).
#
# Deliberately **not a Mortar detonation** (`aihell-mortar-detonation`, a
# sustained 0.32 s low boom with no transient attack, saw 180 → 40 Hz + LP
# noise wash). This cue differentiates with (1) the **metallic clank**
# transient at the attack (a square drop the detonation lacks), (2) a
# **shorter sustain** (0.26 s < 0.32 s) and (3) a different thump contour (a
# fast-attack saw body falling to a low 55 Hz floor, versus the detonation's
# slower wash). The fire fundamental also sits below the Cannon's 800 Hz
# square blip and the Mortar's 220 Hz launch thump, so the heaviest round in
# the game never reads as either weapon.
#
# Seed 32285 is drawn from the game-specific reservation block (first free
# number after the Broadside pair 32283/32284; docs/AUDIO_TONEFORGE_CUE_MAPPING.md)
# and baked via scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-heavy-slug-fire
  description: Player Heavy Slug fire — a low saw boom 110 to 55 Hz with a metallic square clank 1800 to 900 Hz transient, a sine sub one octave below and low-passed noise air, ~0.26 s. The heaviest single-shot fire in the catalogue — the deepest fundamental (60-130 Hz band), the longest decay of the packaged weapons, and deliberately distinct from the aihell-mortar-detonation 0.32 s boom (metallic clank + shorter sustain).
  category: AIHell
  tags:
    - weapon
    - fire
  duration: 0.26
nodes:
  # ── Metallic clank transient — the "clank" that keeps this off the Mortar ──
  # v0 — short square clank 1800 → 900 Hz. The detonation recipe has no square;
  # the clank is what makes the round read as a fired shell, not a blast.
  v0:
    kind: oscillator
    params:
      type: square
      frequency: 1800
    automation:
      frequency:
        - kind: set
          time: 0
          value: 1800
        - kind: exponentialRamp
          time: 0.04
          value: 900
  e0:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.05
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.05
  # ── Low boom body — the deepest fundamental of the set ─────────────
  # v1 — saw body 110 → 55 Hz: below the Mortar fire's 220 Hz thump and the
  # Cannon's 800 Hz blip, inside the brief's ≈ 60–130 Hz fundamental band.
  v1:
    kind: oscillator
    params:
      type: sawtooth
      frequency: 110
    automation:
      frequency:
        - kind: set
          time: 0
          value: 110
        - kind: exponentialRamp
          time: 0.24
          value: 55
  e1:
    kind: envelope
    params:
      attack: 0.004
      decay: 0.25
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0.22
  # v2 — sub reinforcement: a sine deep under the body for the "whole screen"
  # weight; quiet so it tightens the low end without rattling small speakers.
  v2:
    kind: oscillator
    params:
      type: sine
      frequency: 60
    automation:
      frequency:
        - kind: set
          time: 0
          value: 60
        - kind: exponentialRamp
          time: 0.22
          value: 40
  e2:
    kind: envelope
    params:
      attack: 0.004
      decay: 0.22
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0.1
  # ── Shell air — low-passed noise puff ─────────────────────────────
  n0:
    kind: noise
    params:
      color: white
      level: 1
  f0:
    kind: biquadFilter
    params:
      type: lowpass
      frequency: 900
      Q: 1
  e3:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.18
      sustain: 0
      release: 0
  g3:
    kind: gain
    params:
      gain: 0.06
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - chain: [v1, e1, g1, mix]
  - chain: [v2, e2, g2, mix]
  - chain: [n0, f0, e3, g3, mix]
  - from: mix
    to: out
