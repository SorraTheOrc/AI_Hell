# AI Hell cue: aihell-wave-laser-fire — Player Wave Laser fire — sci-fi laser
# "pew": a fast descending sawtooth sweep with a bright square harmonic and a
# short band-passed noise sizzle (AH-0MVREBUJ5004HDRQ).
version: "0.1"
meta:
  name: aihell-wave-laser-fire
  description: Player Wave Laser fire — sci-fi laser beam. A sawtooth sweep falls 2400 to 320 Hz in a fast 0.13 s "pew", a bright square harmonic 1200 to 240 Hz adds the beam's electric edge, and a band-passed noise sweep supplies the ionised sizzle. Deliberately brighter, higher and glassier than the Railgun's deep electromagnetic slam and much longer than the Cannon's 800 to 400 Hz thump, so the single red screen-spanning beam is unmistakable by ear.
