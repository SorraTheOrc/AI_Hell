# AI Hell cue: aihell-pickup-blocked — Pickup refused (six slots full) — low two-step descending square buzz 200 to 120 Hz.
#
# Parent AH-0MVLIJT3M005HPHF (producer Q5b): a drop that cannot be collected
# because the shared six-slot pool is full needs audible feedback. The cue is
