# AI Hell cue: aihell-broadside-fire — Player Broadside fire — a wide
# two-sided swish that reads as a left + right pair leaving the hull.
#
# (AH-0MVV0WNOX0078G9G) The Broadside fires a teal `dart` pair perpendicular
# to the heading (one shot to each side, no forward shot at all), so its launch
# cue must read as *two* swishes leaving the hull left and right — not as a
# second Cannon. Two short band-passed noise sweeps supply that pair inside
# **one baked cue** (no per-shot double dispatch): the first sweeps **up**
# (900 → 3200 Hz, the left dart leaving) at 0 s and the second sweeps **down**
# (3200 → 900 Hz, the right dart leaving) 40 ms later. The opposing sweep
# directions make the pair audible as a left/right gesture even on a mono
# speaker, and the 40 ms inter-onset interval sits inside the 35–50 ms design
# window (documented here and pinned by `src/audio/broadsideFeel.docs.test.ts`).
# A short glassy triangle tail 1800 → 1200 Hz plus a quiet 2400 Hz sine overtone
# gives the pair a teal-toned body so the wide trade-off (coverage without nose
# cover) is audible. Total 0.16 s — brief enough that the hold-full metronome
# never muddies the beat.
#
# Deliberately a different asset from `aihell-cannon-fire`: the Cannon is a
# single 800 → 400 Hz square thump, while this cue is a two-transient noise
# pair with no square oscillator. The distinctness is pinned by
# `src/audio/broadsideFeel.docs.test.ts`.
#
# Seed 32283 is drawn from the game-specific reservation block (the Broadside
# pair 32283/32284, after the Shard Swarm 32279/32280 and Rear Guard
# 32281/32282 pairs; docs/AUDIO_TONEFORGE_CUE_MAPPING.md) and baked via
# scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-broadside-fire
  description: Player Broadside fire — a wide two-sided swish. Two short band-passed noise sweeps 40 ms apart, the first rising 900 to 3200 Hz (left dart) and the second falling 3200 to 900 Hz (right dart), over a short glassy teal-toned triangle tail 1800 to 1200 Hz, 0.16 s. Reads as a left plus right pair leaving the hull rather than a second Cannon.
  category: AIHell
  tags:
    - weapon
    - fire
    - two-sided
    - pair
    - wide
    - teal
    - inter-onset-40ms
  duration: 0.16
nodes:
  # ── Left dart (onset 0 s): rising band-passed noise sweep ──────────
  n0:
    kind: noise
    params:
      color: white
      level: 1
  f0:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 900
      Q: 2
    automation:
      frequency:
        - kind: set
          time: 0
          value: 900
        - kind: exponentialRamp
          time: 0.04
          value: 3200
  e0:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.045
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0
    automation:
      gain:
        - kind: set
          time: 0
          value: 0
        - kind: linearRamp
          time: 0.002
          value: 0.13
        - kind: exponentialRamp
          time: 0.045
          value: 0.0001
  # ── Right dart (onset 0.04 s): falling band-passed noise sweep ─────
  # Gated on 40 ms after the left dart so one cue carries the pair; the
  # inter-onset interval is the design's 35–50 ms window.
  n1:
    kind: noise
    params:
      color: white
      level: 1
  f1:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 3200
      Q: 2
    automation:
      frequency:
        - kind: set
          time: 0.04
          value: 3200
        - kind: exponentialRamp
          time: 0.08
          value: 900
  e1:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.045
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0
    automation:
      gain:
        - kind: set
          time: 0
          value: 0
        - kind: set
          time: 0.04
          value: 0
        - kind: linearRamp
          time: 0.042
          value: 0.13
        - kind: exponentialRamp
          time: 0.085
          value: 0.0001
  # ── Short teal-toned tail ─────────────────────────────────────────
  # A glassy falling triangle plus a quiet sine overtone colours the pair
  # teal so the cue is not just two anonymous noise swishes.
  v0:
    kind: oscillator
    params:
      type: triangle
      frequency: 1800
    automation:
      frequency:
        - kind: set
          time: 0
          value: 1800
        - kind: exponentialRamp
          time: 0.15
          value: 1200
  e2:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.14
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0.07
  v1:
    kind: oscillator
    params:
      type: sine
      frequency: 2400
  e3:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.08
      sustain: 0
      release: 0
  g3:
    kind: gain
    params:
      gain: 0.03
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [n0, f0, e0, g0, mix]
  - chain: [n1, f1, e1, g1, mix]
  - chain: [v0, e2, g2, mix]
  - chain: [v1, e3, g3, mix]
  - from: mix
    to: out
