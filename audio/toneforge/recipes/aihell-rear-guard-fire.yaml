# AI Hell cue: aihell-rear-guard-fire — Player Rear Guard fire — a muted
# rearward *thup*, darker and more muffled than the Cannon's forward thump.
#
# (AH-0MVV0WN96007TU9J) The Rear Guard is the catalogue's only rearward weapon
# (a single rose pellet fired directly behind the heading), so its launch cue
# must be identifiable by ear as *not* a forward shot. A sawtooth body
# 260 → 70 Hz supplies the fundamental — lower than the Cannon's starting
# 800 Hz by construction — and a static 600 Hz low-pass rolls its harmonics
# off fast, below the Cannon's 800 Hz fundamental (the Cannon recipe has no
# low-pass, so its 800 Hz square is its brightest partial; a cutoff under it
# is necessarily darker). There is deliberately **no square oscillator**: the
# Cannon's bright square edge is exactly the forward click the player must not
# hear behind the ship. A low-passed noise layer (500 Hz) supplies the muffled
# air of the *thup*, a quiet 90 Hz sine rounds out the body, and the 0.14 s
# decay is slightly longer than the Cannon's 0.08 s so the rearward shot reads
# as a softer, heavier push rather than a snap.
#
# The distinctness from `aihell-cannon-fire` (different recipe, different
# asset, lower fundamental, lower low-pass cutoff, no square click) is pinned
# by `src/audio/rearGuardFeel.docs.test.ts`.
#
# Seed 32281 is drawn from the game-specific reservation block (the Rear Guard
# pair 32281/32282, after the Railgun 32277/32278 and Shard Swarm 32279/32280
# pairs; docs/AUDIO_TONEFORGE_CUE_MAPPING.md) and baked via
# scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-rear-guard-fire
  description: Player Rear Guard fire — a muted rearward thup. A sawtooth body 260 to 70 Hz through a 600 Hz low-pass supplies a lower, darker fundamental than the Cannon's unfiltered 800 to 400 Hz square, a low-passed noise layer adds the muffled air, a quiet 90 Hz sine rounds out the body, and there is no square click; 0.14 s, slightly longer than the Cannon's 0.08 s. Deliberately darker and more muffled so the backward shot is identifiable by ear.
  category: AIHell
  tags:
    - weapon
    - fire
    - rearward
    - muted
    - darker-than-cannon
    - no-square-click
  duration: 0.14
nodes:
  # ── Muted body: sawtooth 260 → 70 Hz through a low-pass ────────────
  # The low-pass below the Cannon's 800 Hz fundamental is what makes this
  # read as darker and more muffled, not just quieter.
  v0:
    kind: oscillator
    params:
      type: sawtooth
      frequency: 260
    automation:
      frequency:
        - kind: set
          time: 0
          value: 260
        - kind: exponentialRamp
          time: 0.13
          value: 70
  f0:
    kind: biquadFilter
    params:
      type: lowpass
      frequency: 600
      Q: 1
  e0:
    kind: envelope
    params:
      attack: 0.004
      decay: 0.136
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.2
  # ── Muffled air: low-passed noise, the "thup" breath ───────────────
  n0:
    kind: noise
    params:
      color: white
      level: 1
  f1:
    kind: biquadFilter
    params:
      type: lowpass
      frequency: 500
      Q: 1
  e1:
    kind: envelope
    params:
      attack: 0.006
      decay: 0.12
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0.07
  # ── Soft sub roundness ─────────────────────────────────────────────
  v1:
    kind: oscillator
    params:
      type: sine
      frequency: 90
  e2:
    kind: envelope
    params:
      attack: 0.005
      decay: 0.14
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0.08
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [v0, f0, e0, g0, mix]
  - chain: [n0, f1, e1, g1, mix]
  - chain: [v1, e2, g2, mix]
  - from: mix
    to: out
