  parameters:
    - name: endSlot
      type: integer
      min: 1
      max: 2
      unit: int
      overrides:
        - target: v0.automation.frequency.exponentialRamp.value
          expression: "endSlot * 27.5"
    - name: startSlot
      type: integer
      min: 1
      max: 3
      unit: int
      overrides:
        - target: v0.frequency
          expression: "startSlot * 220"
        - target: v0.automation.frequency.set.value
