# AI Hell cue: aihell-rear-guard-impact — Player Rear Guard connect — a soft
# rose pop, ≤ 0.14 s.
#
# (AH-0MVV0WN96007TU9J) The rearward pellet is a single, compact shot, so its
# connect should feel like a soft pop rather than a crack: a rounded triangle
# 380 → 190 Hz carries the short body, a quiet 760 Hz sine adds a gentle
# overtone, and a 700 Hz low-passed noise tick supplies the contact without a
# bright click. There is deliberately **no square oscillator**, and the peak
# oscillator gain is 0.12 against the Cannon's impact peak of 0.24, so a Rear
# Guard connect lands noticeably softer than the forward weapons. Total 0.12 s
# stays under the 0.14 s ceiling.
#
# The distinctness from `aihell-cannon-impact` (different recipe, different
# asset, shorter and softer with no square click) is pinned by
# `src/audio/rearGuardFeel.docs.test.ts`.
#
# Seed 32282 is drawn from the game-specific reservation block (the Rear Guard
# pair 32281/32282; docs/AUDIO_TONEFORGE_CUE_MAPPING.md) and baked via
# scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-rear-guard-impact
  description: Player Rear Guard connect — a soft rose pop. A rounded triangle 380 to 190 Hz carries the short body, a quiet 760 Hz sine adds a gentle overtone and a 700 Hz low-passed noise tick supplies the contact, 0.12 s. Deliberately softer and shorter than the Cannon's 520 to 90 Hz crack with its square click.
  category: AIHell
  tags:
    - weapon
    - hit
    - rearward
    - soft
    - rose
  duration: 0.12
nodes:
  # ── Soft pop body: rounded triangle 380 → 190 Hz ──────────────────
  v0:
    kind: oscillator
    params:
      type: triangle
      frequency: 380
    automation:
      frequency:
        - kind: set
          time: 0
          value: 380
        - kind: exponentialRamp
          time: 0.11
          value: 190
  e0:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.11
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.12
  # ── Gentle overtone ────────────────────────────────────────────────
  v1:
    kind: oscillator
    params:
      type: sine
      frequency: 760
  e1:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.05
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0.035
  # ── Soft contact tick: low-passed noise (no bright click) ──────────
  n0:
    kind: noise
    params:
      color: white
      level: 1
  f0:
    kind: biquadFilter
    params:
      type: lowpass
      frequency: 700
      Q: 1
  e2:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.05
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0.045
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - chain: [v1, e1, g1, mix]
  - chain: [n0, f0, e2, g2, mix]
  - from: mix
    to: out
