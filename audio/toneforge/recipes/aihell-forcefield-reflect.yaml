# AI Hell cue: aihell-forcefield-reflect — Force Field bounces an enemy bullet — bright RISING
# triangle bounce A5 to E6 (880 to 1320 Hz) with a short sine sparkle on top.
# Amplitude tier: subtle one-shot (target RMS 0.055 +/-1.5 dB, AH-0MVRDMMYO002SC5V).
#
# Deliberately distinct from the neighbouring player-feedback ticks:
#   - aihell-bullet-destruction: square tick 1400 -> 900 Hz, FALLING (a shot destroyed);
#   - aihell-ricochet-impact:    triangle 1800 -> 900 Hz, FALLING + noise smack (a wall bounce);
#   - this cue:                  triangle 880 -> 1320 Hz, RISING (a shot bounced back at the enemy).
#
# Balance-guard route: this is player Force Field feedback, not an enemy cue, so the recipe is
# tagged player/force-field/reflect with no enemy-family tag. `scripts/audio-balance-guard.mjs`
# therefore leaves it outside the enemy balance tiers; the 0.055 subtle one-shot target above is
# enforced by the rendered-asset review recorded in docs/AUDIO_TONEFORGE_CUE_MAPPING.md.
