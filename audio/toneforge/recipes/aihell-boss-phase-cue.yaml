# AI Hell cue: aihell-boss-phase-cue — Boss phase cue — per-phase square rise (4 seed variants).
# Seed range (seeds 32242, 32227, 32207, 32204): four distinct A-minor scale-degree rises — phase 1 starts
# A3, phase 2 A4, phase 3 E5, phase 4 A5, each rising to A5 (880 Hz), per-phase tell preserved without
# off-scale pitches (AC3, AH-0MVCRR203005HKVZ).
version: "0.1"
meta:
  name: aihell-boss-phase-cue
  description: Boss phase cue — per-phase A-minor square rise (4 seed variants).
  category: AIHell
  tags:
    - boss
    - phase
  duration: 0.3
  parameters:
    - name: endSlot
      type: integer
      min: 3
      max: 4
      unit: int
      overrides:
        - target: v0.automation.frequency.exponentialRamp.value
          expression: "endSlot * 220"
    - name: startSlot
      type: integer
      min: 1
      max: 4
      unit: int
      overrides:
        - target: v0.frequency
          expression: "startSlot * 220"
        - target: v0.automation.frequency.set.value
          expression: "startSlot * 220"
nodes:
  v0:
    kind: oscillator
    params:
      type: square
      frequency: 440
    automation:
      frequency:
        - kind: set
          time: 0
          value: 440
        - kind: exponentialRamp
          time: 0.3
          value: 660
  e0:
    kind: envelope
    params:
      attack: 0.004
      decay: 0.296
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.1
  mix:
    kind: gain
    params:
      gain: 1
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - from: mix
    to: out
