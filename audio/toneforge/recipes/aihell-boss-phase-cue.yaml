      attack: 0.004
      decay: 0.296
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.1
  mix:
    kind: gain
    params:
      gain: 1
  out:
    kind: destination
routing:
  - chain: [v0, e0, g0, mix]
  - from: mix
    to: out
