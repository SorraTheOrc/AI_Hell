# AI Hell cue: aihell-shard-swarm-fire — Player Shard Swarm fire — a tight
# multi-shard "chk" burst coloured by bright glassy lime.
#
# (AH-0MVV0WMTE0007NGS) The Shard Swarm is a five-shard ±15° fan; its launch
# must read as several small angular shards leaving the hull at once, not as
# one blunt cannon thump. Three short high-passed noise ticks at 0 / 0.03 /
# 0.06 s supply the percussive multi-shard *chk* attack, a fast bright triangle
# 2600 → 1700 Hz supplies the glassy lime body, and a brief high square
# 3400 → 2200 Hz tick adds the brittle edge. Total 0.15 s — inside the
# 0.12–0.16 s brief — so a five-shard volley reads as a single tight burst and
# the per-cue voice limiter (4 voices / 150 ms) is never stressed. Deliberately
# brighter and glassier than the Cannon's 800 → 400 Hz square blip and shorter
# than the Railgun's 0.2 s electromagnetic slam.
#
# Seed 32279 is drawn from the game-specific reservation block (first free
# number after the Railgun pair 32277/32278; docs/AUDIO_TONEFORGE_CUE_MAPPING.md)
# and baked via scripts/build-audio.sh.
version: "0.1"
meta:
  name: aihell-shard-swarm-fire
  description: Player Shard Swarm fire — a tight multi-shard chk burst of three short high-passed noise ticks (0, 0.03, 0.06 s) over a bright glassy triangle 2600 to 1700 Hz and a brief high square 3400 to 2200 Hz edge, 0.15 s. Brighter, glassier and more percussive than the Cannon's 800 to 400 Hz thump and shorter than the Railgun's heavy electromagnetic slam.
  category: AIHell
  tags:
    - weapon
    - fire
  duration: 0.15
nodes:
  # ── Three shard transients (0 / 0.03 / 0.06 s) — the *chk* burst ──
  # n0 — first shard: high-pass noise tick.
  n0:
    kind: noise
    params:
      color: white
      level: 1
  f0:
    kind: biquadFilter
    params:
      type: highpass
      frequency: 3200
      Q: 1
  e0:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.025
      sustain: 0
      release: 0
  g0:
    kind: gain
    params:
      gain: 0.13
  # n1 — second shard, offset by 30 ms via gain automation.
  n1:
    kind: noise
    params:
      color: white
      level: 1
  f1:
    kind: biquadFilter
    params:
      type: highpass
      frequency: 3400
      Q: 1
  e1:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.025
      sustain: 0
      release: 0
  g1:
    kind: gain
    params:
      gain: 0
    automation:
      gain:
        - kind: set
          time: 0
          value: 0
        - kind: set
          time: 0.03
          value: 0
        - kind: linearRamp
          time: 0.033
          value: 0.12
        - kind: exponentialRamp
          time: 0.055
          value: 0.0001
  # n2 — third shard, offset by 60 ms.
  n2:
    kind: noise
    params:
      color: white
      level: 1
  f2:
    kind: biquadFilter
    params:
      type: highpass
      frequency: 3000
      Q: 1
  e2:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.025
      sustain: 0
      release: 0
  g2:
    kind: gain
    params:
      gain: 0
    automation:
      gain:
        - kind: set
          time: 0
          value: 0
        - kind: set
          time: 0.06
          value: 0
        - kind: linearRamp
          time: 0.063
          value: 0.10
        - kind: exponentialRamp
          time: 0.085
          value: 0.0001
  # ── Glassy lime body ───────────────────────────────────────────────
  # v0 — fast bright triangle falling 2600 → 1700 Hz: the glassy "lime" tone.
  v0:
    kind: oscillator
    params:
      type: triangle
      frequency: 2600
    automation:
      frequency:
        - kind: set
          time: 0
          value: 2600
        - kind: exponentialRamp
          time: 0.12
          value: 1700
  e3:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.12
      sustain: 0
      release: 0
  g3:
    kind: gain
    params:
      gain: 0.09
  # v1 — brittle high square edge on the attack.
  v1:
    kind: oscillator
    params:
      type: square
      frequency: 3400
    automation:
      frequency:
        - kind: set
          time: 0
          value: 3400
        - kind: exponentialRamp
          time: 0.03
          value: 2200
  e4:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.03
      sustain: 0
      release: 0
  g4:
    kind: gain
    params:
      gain: 0.055
  mix:
    kind: gain
    params:
      gain: 0.9
  out:
    kind: destination
routing:
  - chain: [n0, f0, e0, g0, mix]
  - chain: [n1, f1, e1, g1, mix]
  - chain: [n2, f2, e2, g2, mix]
  - chain: [v0, e3, g3, mix]
  - chain: [v1, e4, g4, mix]
  - from: mix
    to: out
